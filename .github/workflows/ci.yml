name: CaseFiles CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[ui-audit]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/i18n-coverage.mjs
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w apps/web
      # Do not create disposable production sessions on every draft PR update.
      - run: node scripts/production-smoke.mjs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: npm run test:e2e:prod -w apps/web
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  ui-audit:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ui-audit]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck -w apps/web
      - run: node --check scripts/ui-coverage-report.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w apps/web -- --grep "Universe map travel|Universe people approach"
